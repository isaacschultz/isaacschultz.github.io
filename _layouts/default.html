<!DOCTYPE html>
<html>
  <head>
      <meta charset="utf-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
      <title>{{ page.title }}</title>
      <meta name="viewport" content="width=device-width">

      <!-- syntax highlighting CSS -->
      <link rel="stylesheet" href="/css/syntax.css">

      <!-- Custom CSS -->
      <link rel="stylesheet" href="/css/main.css">

      <!-- Google Fonts -->
      <link href='https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap' rel='stylesheet' type='text/css'>

      <!-- Dark by default; apply before first paint to avoid a light flash -->
      <script>
        (function () {
          var theme = 'dark';
          try {
            if (localStorage.getItem('theme') === 'light') theme = 'light';
          } catch (e) {}
          if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        })();
      </script>
  </head>
  <body>
    <div class="site">
	  <div class="main" id="main">
		<h1 class="banner"><img id="banner" src="/assets/site-images/banner2.png" width="1000" height="186" alt=""></a></h1>
	  </div>
      <div class="sidebar" id="sidebar">
        <div class="header">
          <h1 class="title"><a href="/"><img class="logo logo-light" src="/assets/site-images/logo4.png" width="540" height="540" alt="Home"><img class="logo logo-dark" src="/assets/site-images/logo4-red.png" width="540" height="540" alt="Home"></a></h1>
          <span class="tagline"></span>
        </div>
        <div class="posts">
          <ul class="posts-list">
            {% for post in site.posts %}
              <li class="post-link">
                <a class="post-title" href="{{ post.url }}">
                  <span class="post-date">{{ post.date | date_to_string }}</span>
                  {{ post.title }}
                </a>
              </li>
            {% endfor %}
          </ul>
        </div>
        <div class="footer">
          <div id="footer-links">
            <div class="footer-gallery-row">
              <a href="{{ site.url }}/gallery" class="footer-link footer-link-gallery">Gallery</a>
            </div>
            <div class="footer-visionboard-row">
              <a href="{{ site.url }}/visionboard/" class="footer-link footer-link-gallery">Vision Board</a>
            </div>
            <div class="footer-other-row">
              <a href="https://txt.fyi/+/499fc0c5/" class="footer-link">About</a> <span class="separator">&bull;</span>
              <a href="http://www.linkedin.com/in/isaac-schultz-1b20ab43" class="footer-link">LinkedIn</a>
            </div>
            <div class="footer-theme-row">
              <button type="button" id="theme-toggle" class="footer-link theme-toggle" aria-label="Dark mode" aria-pressed="false">
                <svg class="theme-toggle-icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
                  <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
                  <path d="M8 1.5 A6.5 6.5 0 0 1 8 14.5 Z" fill="currentColor"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

        {{ content }}

    </div>
    <script>
      (function () {
        var root = document.documentElement;
        var toggle = document.getElementById("theme-toggle");

        function render() {
          var dark = root.getAttribute("data-theme") === "dark";
          toggle.setAttribute("aria-pressed", dark ? "true" : "false");
          toggle.title = dark ? "Switch to light mode" : "Switch to dark mode";
        }

        toggle.addEventListener("click", function () {
          var dark = root.getAttribute("data-theme") !== "dark";
          if (dark) {
            root.setAttribute("data-theme", "dark");
          } else {
            root.removeAttribute("data-theme");
          }
          try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
          render();
        });

        render();
      })();
    </script>
    <script>
      document.getElementById("sidebar-button").addEventListener("click", function() {
        document.getElementById("sidebar").classList.toggle("slideIn");
      });
    </script>
  </body>
</html>
