<div class="content" id="home">
  {% include sidebar-button.html %}
  <div id="post-info">
    {% if page.cover and page.cover != "null.png" %}
    <div id="cover-photo-container">
      <img id="cover-photo" src="/assets/site-images/{{ page.cover }}">
    </div>
    {% endif %}
    <div id="info-container">
      <h1 id="title">{{ page.title }}</h1>
      {% if page.date %}
      <span id="date">{{ page.date | date_to_string }}</span>
      {% endif %}
    </div>
  </div>

  <div class="post">
    {{ content }}
  </div>
  {% if page.date %}
  <div class="colophon">
    <p>
      <span id="pub-date">Published on {{ page.date | date_to_string }}</span>
    </p>
  </div>
  {% endif %}
</div>
