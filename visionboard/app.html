<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vision Board</title>
<script>
  // Apply saved/system theme before paint to avoid a flash of the wrong theme.
  (function () {
    try {
      var t = localStorage.getItem("vision-board:theme");
      if (t !== "dark" && t !== "light") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
<style>
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --board-bg: #ffffff;
    --ink: #1f2430;
    --muted: #8a93a3;
    --border: #d8dce4;
    --border-hover: #c7cdd8;
    --border-soft: #e6e9ef;
    --btn-bg: #ffffff;
    --btn-hover: #f5f7fa;
    --pill-bg: #f3f5f8;
    --kbd-bg: #ffffff;
    --accent: #3b82f6;
    --accent-hover: #2f74ec;
    --danger: #ef4444;
    --danger-soft: #fef2f2;
    --danger-border: #f4b4b4;
    --empty-title: #5b6472;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.10);
  }

  html[data-theme="dark"] {
    --bg: #13161b;
    --panel: #1b2027;
    --board-bg: #181c22;
    --ink: #e7eaf0;
    --muted: #8b95a5;
    --border: #2d343d;
    --border-hover: #3a424d;
    --border-soft: #262c34;
    --btn-bg: #232932;
    --btn-hover: #2c333d;
    --pill-bg: #232932;
    --kbd-bg: #2c333d;
    --accent: #4f8ff7;
    --accent-hover: #6aa1f8;
    --danger: #f0616d;
    --danger-soft: #36262a;
    --danger-border: #5e3940;
    --empty-title: #aab2c0;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- Toolbar ---- */
  .toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border-soft);
    z-index: 50;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 650;
    font-size: 15px;
    letter-spacing: .2px;
    margin-right: 6px;
    user-select: none;
  }
  .brand .dot {
    width: 18px; height: 18px; border-radius: 6px;
    background: linear-gradient(135deg, #6366f1, #3b82f6 55%, #06b6d4);
    box-shadow: 0 2px 6px rgba(59,130,246,.4);
  }

  .spacer { flex: 1 1 auto; }

  button.btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--btn-bg);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    font-weight: 550;
    padding: 7px 13px;
    border-radius: 9px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: background .12s, border-color .12s, opacity .12s, transform .04s;
    white-space: nowrap;
  }
  button.btn:hover { background: var(--btn-hover); border-color: var(--border-hover); }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { opacity: .4; cursor: default; transform: none; background: var(--btn-bg); border-color: var(--border); }

  button.btn.icon-only { padding: 7px 9px; }

  button.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

  button.btn.danger:not(:disabled):hover {
    background: var(--danger-soft); border-color: var(--danger-border); color: var(--danger);
  }

  .btn svg { width: 16px; height: 16px; display: block; }

  .divider {
    width: 1px; height: 24px; background: var(--border-soft); margin: 0 4px;
  }

  .hint-pill {
    font-size: 12.5px;
    color: var(--muted);
    background: var(--pill-bg);
    border: 1px solid var(--border-soft);
    padding: 5px 10px;
    border-radius: 999px;
    user-select: none;
  }
  kbd {
    font: inherit;
    font-size: 11px;
    background: var(--kbd-bg);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 5px;
    color: var(--ink);
  }

  /* theme toggle icons (selectors out-specify `.btn svg` so the toggle wins) */
  .btn svg.theme-sun { display: none; }
  html[data-theme="dark"] .btn svg.theme-moon { display: none; }
  html[data-theme="dark"] .btn svg.theme-sun { display: block; }

  /* ---- Stage / Board ---- */
  .stage {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    padding: 22px;
  }

  .board {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--board-bg);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: background .15s;
  }

  .board.drag-over::after {
    content: "Drop images to add";
    position: absolute;
    inset: 10px;
    border: 2.5px dashed var(--accent);
    border-radius: 10px;
    background: rgba(59,130,246,.06);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    color: var(--accent);
    pointer-events: none;
    z-index: 9999;
  }

  /* ---- Empty state ---- */
  .empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    pointer-events: none;
    gap: 14px;
    padding: 20px;
  }
  .empty .icon {
    width: 56px; height: 56px; opacity: .5;
  }
  .empty h2 { margin: 0; font-size: 19px; color: var(--empty-title); font-weight: 650; }
  .empty p { margin: 0; font-size: 14px; max-width: 360px; line-height: 1.5; }
  .empty.hidden { display: none; }

  /* ---- Image items ---- */
  .item {
    position: absolute;
    touch-action: none;
    cursor: grab;
    border-radius: 3px;
    box-shadow: 0 2px 8px rgba(16,24,40,.18);
    user-select: none;
  }
  .item img {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    border-radius: 3px;
    -webkit-user-drag: none;
  }
  .item.dragging { cursor: grabbing; box-shadow: 0 10px 30px rgba(16,24,40,.28); }

  .item.selected {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* resize handle */
  .handle {
    position: absolute;
    width: 16px; height: 16px;
    right: -9px; bottom: -9px;
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 50%;
    cursor: nwse-resize;
    display: none;
    box-shadow: 0 1px 3px rgba(16,24,40,.3);
    touch-action: none;
  }
  .item.selected .handle { display: block; }

  /* delete badge */
  .del {
    position: absolute;
    top: -11px; right: -11px;
    width: 23px; height: 23px;
    background: var(--danger);
    color: #fff;
    border: 2px solid var(--panel);
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(16,24,40,.3);
    touch-action: none;
  }
  .del svg { width: 11px; height: 11px; }
  .item.selected .del { display: flex; }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1f2430;
    color: #fff;
    padding: 11px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    box-shadow: 0 8px 28px rgba(0,0,0,.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 1000;
    max-width: 80vw;
    text-align: center;
  }
  html[data-theme="dark"] .toast { background: #2c333d; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 680px) {
    .hint-pill { display: none; }
    .brand span.name { display: none; }
    .btn-label { display: none; }
    button.btn { padding: 8px 10px; }
    button.btn.icon-only { padding: 8px; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="brand"><span class="dot"></span><span class="name">Vision Board</span></div>

    <button class="btn primary" id="addBtn" title="Add image from your device">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="btn-label">Add image</span>
    </button>

    <div class="divider"></div>

    <button class="btn" id="frontBtn" disabled title="Bring selected image to front">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>
      <span class="btn-label">Front</span>
    </button>
    <button class="btn" id="backBtn" disabled title="Send selected image to back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="12" height="12" rx="2"/><path d="M20 8v10a2 2 0 0 1-2 2H8"/></svg>
      <span class="btn-label">Back</span>
    </button>
    <button class="btn danger" id="delBtn" disabled title="Delete selected image (Del)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      <span class="btn-label">Delete</span>
    </button>

    <span class="spacer"></span>

    <span class="hint-pill">Paste <kbd>⌘</kbd>/<kbd>Ctrl</kbd>+<kbd>V</kbd>, drop a file, or Add image</span>

    <button class="btn icon-only" id="themeBtn" title="Switch to dark mode" aria-label="Toggle dark mode" aria-pressed="false">
      <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </button>

    <div class="divider"></div>

    <button class="btn" id="clearBtn" title="Remove all images">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m5 4v6m4-6v6"/></svg>
      <span class="btn-label">Clear</span>
    </button>
    <button class="btn primary" id="exportBtn" title="Download the board as a PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
      <span class="btn-label">Export PNG</span>
    </button>
  </div>

  <div class="stage">
    <div class="board" id="board">
      <div class="empty" id="empty">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <h2>Your board is empty</h2>
        <p>Copy an image anywhere and paste it here, drag an image file onto the board, or use <strong>Add image</strong>. Drag to move, drag the corner to resize.</p>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple hidden />
  <div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "vision-board:v1";
  const THEME_KEY = "vision-board:theme";
  const MIN_SIZE = 40;          // smallest allowed edge, px
  const MAX_INIT_FRAC = 0.45;   // a new image starts at most this fraction of the board's smaller edge

  const board   = document.getElementById("board");
  const empty   = document.getElementById("empty");
  const toastEl = document.getElementById("toast");
  const fileInput = document.getElementById("fileInput");
  const themeBtn = document.getElementById("themeBtn");

  const btn = {
    add:    document.getElementById("addBtn"),
    front:  document.getElementById("frontBtn"),
    back:   document.getElementById("backBtn"),
    del:    document.getElementById("delBtn"),
    clear:  document.getElementById("clearBtn"),
    export: document.getElementById("exportBtn"),
  };

  /** @type {{id:string,src:string,x:number,y:number,width:number,height:number,z:number}[]} */
  let items = [];
  let maxZ = 0;
  let selectedId = null;
  const els = new Map(); // id -> { root, img, handle, del }

  // ---------- theme ----------
  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    const dark = t === "dark";
    themeBtn.setAttribute("aria-pressed", String(dark));
    themeBtn.title = dark ? "Switch to light mode" : "Switch to dark mode";
  }
  function toggleTheme() {
    const next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
  }

  // ---------- persistence ----------
  let saveTimer = null;
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 250);
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, maxZ }));
    } catch (err) {
      if (err && (err.name === "QuotaExceededError" || /quota/i.test(err.message))) {
        toast("Board is too large to auto-save — export it to keep a copy.");
      }
    }
  }
  function load() {
    let data;
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
    catch { data = null; }
    if (data && Array.isArray(data.items)) {
      items = data.items;
      maxZ = data.maxZ || items.reduce((m, it) => Math.max(m, it.z || 0), 0);
      items.forEach(createItemEl);
    }
    updateEmpty();
  }

  // ---------- helpers ----------
  let idCounter = 0;
  function uid() {
    idCounter += 1;
    return "img_" + idCounter + "_" + (performance.now() | 0);
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 2600);
  }

  function updateEmpty() {
    empty.classList.toggle("hidden", items.length > 0);
  }

  function updateToolbar() {
    const has = selectedId !== null;
    btn.front.disabled = !has;
    btn.back.disabled = !has;
    btn.del.disabled = !has;
    btn.clear.disabled = items.length === 0;
    btn.export.disabled = items.length === 0;
  }

  // ---------- adding images ----------
  // Reads a File/Blob into a data URL and places it on the board.
  function addImageFromBlob(blob, dropPoint) {
    if (!blob || !/^image\//.test(blob.type)) return;
    const reader = new FileReader();
    reader.onload = () => addImageFromSrc(String(reader.result), dropPoint);
    reader.readAsDataURL(blob);
  }

  function addImageFromSrc(src, dropPoint) {
    const probe = new Image();
    probe.onload = () => {
      const rect = board.getBoundingClientRect();
      const natW = probe.naturalWidth || 300;
      const natH = probe.naturalHeight || 300;
      const aspect = natW / natH;

      // initial size: cap to a fraction of the board's smaller edge
      const cap = Math.min(rect.width, rect.height) * MAX_INIT_FRAC;
      let w = natW, h = natH;
      if (w > cap) { w = cap; h = w / aspect; }
      if (h > cap) { h = cap; w = h * aspect; }
      w = Math.max(MIN_SIZE, w);
      h = Math.max(MIN_SIZE, h);

      let cx, cy;
      if (dropPoint) {
        cx = dropPoint.x - rect.left;
        cy = dropPoint.y - rect.top;
      } else {
        // centre, with a small cascade so repeated pastes don't perfectly overlap
        const off = (items.length % 6) * 18;
        cx = rect.width / 2 + off;
        cy = rect.height / 2 + off;
      }

      let x = cx - w / 2;
      let y = cy - h / 2;
      x = Math.max(0, Math.min(x, rect.width - w));
      y = Math.max(0, Math.min(y, rect.height - h));

      maxZ += 1;
      const item = { id: uid(), src, x, y, width: w, height: h, z: maxZ };
      items.push(item);
      createItemEl(item);
      select(item.id);
      updateEmpty();
      updateToolbar();
      scheduleSave();
    };
    probe.src = src;
  }

  // ---------- DOM for an item ----------
  function createItemEl(item) {
    const root = document.createElement("div");
    root.className = "item";
    root.dataset.id = item.id;

    const img = document.createElement("img");
    img.src = item.src;
    img.alt = "";
    root.appendChild(img);

    const handle = document.createElement("div");
    handle.className = "handle";
    root.appendChild(handle);

    const del = document.createElement("div");
    del.className = "del";
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>';
    root.appendChild(del);

    board.appendChild(root);
    els.set(item.id, { root, img, handle, del });
    applyStyle(item);

    root.addEventListener("pointerdown", (e) => startMove(e, item));
    handle.addEventListener("pointerdown", (e) => startResize(e, item));
    del.addEventListener("pointerdown", (e) => { e.stopPropagation(); });
    del.addEventListener("click", (e) => { e.stopPropagation(); removeItem(item.id); });
  }

  function applyStyle(item) {
    const el = els.get(item.id);
    if (!el) return;
    const r = el.root.style;
    r.left = item.x + "px";
    r.top = item.y + "px";
    r.width = item.width + "px";
    r.height = item.height + "px";
    r.zIndex = String(item.z);
  }

  function getItem(id) { return items.find((it) => it.id === id); }

  // ---------- selection ----------
  function select(id) {
    if (selectedId === id) { updateToolbar(); return; }
    if (selectedId && els.has(selectedId)) els.get(selectedId).root.classList.remove("selected");
    selectedId = id;
    if (id && els.has(id)) els.get(id).root.classList.add("selected");
    updateToolbar();
  }
  function deselect() { select(null); }

  // ---------- move ----------
  function startMove(e, item) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    select(item.id);
    const el = els.get(item.id);
    const rect = board.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const origX = item.x, origY = item.y;
    let moved = false;

    el.root.classList.add("dragging");
    el.root.setPointerCapture(e.pointerId);

    function onMove(ev) {
      let nx = origX + (ev.clientX - startX);
      let ny = origY + (ev.clientY - startY);
      nx = Math.max(0, Math.min(nx, rect.width - item.width));
      ny = Math.max(0, Math.min(ny, rect.height - item.height));
      item.x = nx; item.y = ny;
      el.root.style.left = nx + "px";
      el.root.style.top = ny + "px";
      moved = true;
    }
    function onUp(ev) {
      el.root.releasePointerCapture(e.pointerId);
      el.root.removeEventListener("pointermove", onMove);
      el.root.removeEventListener("pointerup", onUp);
      el.root.removeEventListener("pointercancel", onUp);
      el.root.classList.remove("dragging");
      if (moved) scheduleSave();
    }
    el.root.addEventListener("pointermove", onMove);
    el.root.addEventListener("pointerup", onUp);
    el.root.addEventListener("pointercancel", onUp);
  }

  // ---------- resize (aspect-locked from bottom-right) ----------
  function startResize(e, item) {
    if (e.button !== undefined && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    select(item.id);
    const el = els.get(item.id);
    const rect = board.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const origW = item.width, origH = item.height;
    const aspect = origW / origH;
    let changed = false;

    el.handle.setPointerCapture(e.pointerId);

    function onMove(ev) {
      const dx = ev.clientX - startX;
      const dy = ev.clientY - startY;
      // drive by whichever axis moved more, keep aspect ratio
      let w = origW + (Math.abs(dx) >= Math.abs(dy) ? dx : dy * aspect);
      w = Math.max(MIN_SIZE, w);
      let h = w / aspect;
      // keep within the board (don't let it spill past right/bottom edges)
      w = Math.min(w, rect.width - item.x);
      h = w / aspect;
      if (item.y + h > rect.height) {
        h = rect.height - item.y;
        w = h * aspect;
      }
      item.width = w; item.height = h;
      el.root.style.width = w + "px";
      el.root.style.height = h + "px";
      changed = true;
    }
    function onUp() {
      el.handle.releasePointerCapture(e.pointerId);
      el.handle.removeEventListener("pointermove", onMove);
      el.handle.removeEventListener("pointerup", onUp);
      el.handle.removeEventListener("pointercancel", onUp);
      if (changed) scheduleSave();
    }
    el.handle.addEventListener("pointermove", onMove);
    el.handle.addEventListener("pointerup", onUp);
    el.handle.addEventListener("pointercancel", onUp);
  }

  // ---------- delete ----------
  function removeItem(id) {
    const idx = items.findIndex((it) => it.id === id);
    if (idx === -1) return;
    items.splice(idx, 1);
    const el = els.get(id);
    if (el) el.root.remove();
    els.delete(id);
    if (selectedId === id) selectedId = null;
    updateEmpty();
    updateToolbar();
    scheduleSave();
  }

  // ---------- layering ----------
  function bringToFront(id) {
    const item = getItem(id);
    if (!item) return;
    maxZ += 1;
    item.z = maxZ;
    applyStyle(item);
    scheduleSave();
  }
  function sendToBack(id) {
    const item = getItem(id);
    if (!item) return;
    const minZ = items.reduce((m, it) => Math.min(m, it.z), Infinity);
    item.z = minZ - 1;
    applyStyle(item);
    scheduleSave();
  }

  // ---------- export to PNG ----------
  async function exportPNG() {
    if (items.length === 0) return;
    const rect = board.getBoundingClientRect();
    const scale = Math.min(2, window.devicePixelRatio || 1) * 1.5; // crisp output
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(rect.width * scale);
    canvas.height = Math.round(rect.height * scale);
    const ctx = canvas.getContext("2d");
    // match the board's current background (white in light mode, dark in dark mode)
    const boardBg = getComputedStyle(board).backgroundColor || "#ffffff";
    ctx.fillStyle = boardBg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.imageSmoothingQuality = "high";

    const ordered = [...items].sort((a, b) => a.z - b.z);
    try {
      await Promise.all(ordered.map((it) => new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => {
          ctx.drawImage(im, it.x * scale, it.y * scale, it.width * scale, it.height * scale);
          resolve();
        };
        im.onerror = reject;
        im.src = it.src;
      })));
    } catch {
      toast("Couldn't render one of the images for export.");
      return;
    }

    canvas.toBlob((blob) => {
      if (!blob) { toast("Export failed."); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "vision-board.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      toast("Exported vision-board.png");
    }, "image/png");
  }

  // ---------- events ----------
  // Deselect when clicking empty board area
  board.addEventListener("pointerdown", (e) => {
    if (e.target === board || e.target === empty) deselect();
  });

  // Toolbar
  themeBtn.addEventListener("click", toggleTheme);
  btn.add.addEventListener("click", () => fileInput.click());
  btn.front.addEventListener("click", () => selectedId && bringToFront(selectedId));
  btn.back.addEventListener("click", () => selectedId && sendToBack(selectedId));
  btn.del.addEventListener("click", () => selectedId && removeItem(selectedId));
  btn.export.addEventListener("click", exportPNG);
  btn.clear.addEventListener("click", () => {
    if (items.length === 0) return;
    if (!confirm("Remove all images from the board?")) return;
    items.slice().forEach((it) => removeItem(it.id));
    toast("Board cleared");
  });

  // File picker
  fileInput.addEventListener("change", () => {
    [...fileInput.files].forEach((f) => addImageFromBlob(f));
    fileInput.value = "";
  });

  // Paste
  window.addEventListener("paste", (e) => {
    const itemsList = e.clipboardData && e.clipboardData.items;
    if (!itemsList) return;
    let found = false;
    for (const it of itemsList) {
      if (it.type && it.type.startsWith("image/")) {
        const blob = it.getAsFile();
        if (blob) { addImageFromBlob(blob); found = true; }
      }
    }
    if (found) e.preventDefault();
  });

  // Drag & drop files onto the board
  ["dragenter", "dragover"].forEach((ev) =>
    board.addEventListener(ev, (e) => {
      if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) {
        e.preventDefault();
        board.classList.add("drag-over");
      }
    })
  );
  ["dragleave", "drop"].forEach((ev) =>
    board.addEventListener(ev, (e) => {
      if (ev === "dragleave" && e.relatedTarget && board.contains(e.relatedTarget)) return;
      board.classList.remove("drag-over");
    })
  );
  board.addEventListener("drop", (e) => {
    e.preventDefault();
    const files = e.dataTransfer && e.dataTransfer.files;
    if (!files || !files.length) return;
    const point = { x: e.clientX, y: e.clientY };
    [...files].forEach((f) => addImageFromBlob(f, point));
  });

  // Keyboard: delete selected
  window.addEventListener("keydown", (e) => {
    if ((e.key === "Delete" || e.key === "Backspace") && selectedId) {
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      e.preventDefault();
      removeItem(selectedId);
    }
  });

  // ---------- init ----------
  applyTheme(currentTheme());
  load();
  updateToolbar();
})();
</script>
</body>
</html>
